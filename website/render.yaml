services:
  - type: web
    name: clipit-store
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHIPPING_COUNTRIES
        value: US
      - key: STRIPE_AUTOMATIC_TAX
        value: "false"
      - key: APP_STORE_URL
        sync: false
      - key: PLAY_STORE_URL
        sync: false
      - key: HOW_IT_WORKS_YOUTUBE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        value: support@clipitbutton.com
      # Verified reviews: configure these after creating Render Postgres and an
      # S3-compatible review-media bucket/CDN. Keep values secret in Render.
      - key: DATABASE_URL
        sync: false
      - key: REVIEW_MEDIA_BUCKET
        sync: false
      - key: REVIEW_MEDIA_REGION
        value: auto
      - key: REVIEW_MEDIA_ENDPOINT
        sync: false
      - key: REVIEW_MEDIA_ACCESS_KEY_ID
        sync: false
      - key: REVIEW_MEDIA_SECRET_ACCESS_KEY
        sync: false
      - key: REVIEW_MEDIA_PUBLIC_BASE_URL
        sync: false
